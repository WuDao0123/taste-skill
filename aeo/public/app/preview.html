<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Widget preview</title>
<style>body{margin:0;padding:32px 16px;background:#f3f2ee;font:15px system-ui,sans-serif}.note{max-width:640px;margin:0 auto 16px;color:#5d6370}#citekit-audit{max-width:640px;margin:0 auto}</style>
</head>
<body>
<p class="note">This is how the audit looks on your site. Audits you run here count toward your monthly limit, and the email you enter is saved as a lead.</p>
<div id="citekit-audit"></div>
<script>
  const s = document.createElement('script');
  s.src = '/embed.js';
  s.dataset.widget = new URLSearchParams(location.search).get('w') || '';
  document.body.appendChild(s);
</script>
</body>
</html>
